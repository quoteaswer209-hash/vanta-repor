name: Build VANTA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip VANTA-Reporter-APK-ready.zip

      - name: Build APK
        run: |
          cd VANTA-Reporter
          gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VANTA-Reporter-APK
          path: VANTA-Reporter/app/build/outputs/apk/debug/app-debug.apk
